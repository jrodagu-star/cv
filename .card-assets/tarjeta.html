<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Jorge A. Rodríguez Aguirregabiria</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @page { size: 55mm 85mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 55mm; height: 85mm; }
  body {
    font-family: Inter, "Avenir Next", sans-serif;
    color: #EAF6F3;
    background: #0B2B33;
  }
  .card {
    width: 55mm; height: 85mm;
    background: linear-gradient(180deg, #0E3A42 0%, #0B2B33 42%, #0A3330 100%);
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .bar {
    width: 100%; height: 1.3mm;
    background: linear-gradient(90deg, #12A38B 0%, #E9A93C 100%);
  }
  .main {
    flex: 1;
    width: 100%;
    padding: 4.2mm 3.6mm 2.2mm;
    display: flex; flex-direction: column; align-items: center;
  }
  .avatar {
    width: 11.5mm; height: 11.5mm; border-radius: 50%;
    border: 0.45mm solid #12A38B;
    background: #123840;
    display: flex; align-items: center; justify-content: center;
    font-family: "Space Grotesk", "Avenir Next", sans-serif;
    font-weight: 700; font-size: 11pt; color: #fff;
  }
  h1 {
    margin-top: 2.6mm;
    font-family: "Space Grotesk", "Avenir Next", sans-serif;
    font-weight: 700; font-size: 11.2pt; line-height: 1.12;
    letter-spacing: -0.01em; color: #fff;
    max-width: 48mm;
  }
  .pill {
    margin-top: 2.2mm;
    background: #12A38B; color: #fff;
    font-size: 6.2pt; font-weight: 600;
    padding: 1mm 2.6mm; border-radius: 999px;
  }
  .contact {
    margin-top: 2.6mm;
    display: flex; flex-direction: column; gap: 1.05mm;
    font-size: 5.6pt; color: rgba(234,246,243,.82);
  }
  .contact span { display: flex; align-items: center; justify-content: center; gap: 1.3mm; }
  .contact svg { width: 2.4mm; height: 2.4mm; color: #63C7B5; flex-shrink: 0; }
  .langs {
    margin-top: auto;
    width: 36mm;
    background: #1A5560;
    border-radius: 2.4mm;
    padding: 1.8mm 2mm 1.5mm;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1.2mm;
  }
  a.lang {
    display: flex; flex-direction: column; align-items: center; gap: 0.7mm;
    text-decoration: none; color: rgba(234,246,243,.78);
  }
  .flag {
    width: 5.6mm; height: 3.7mm;
    color: rgba(154, 206, 196, .72);
  }
  .flag svg { display: block; width: 100%; height: 100%; }
  .name {
    font-family: "Space Grotesk", "Avenir Next", sans-serif;
    font-size: 4.6pt; font-weight: 500; letter-spacing: 0.01em;
  }
  .caption {
    margin-top: 2mm;
    display: flex; align-items: center; justify-content: center; gap: 1.2mm;
    font-size: 4.6pt; letter-spacing: 0.12em; text-transform: uppercase;
    color: rgba(234,246,243,.7);
  }
  .caption svg { width: 3.2mm; height: 3.2mm; color: #63C7B5; flex-shrink: 0; }
  .foot {
    margin-top: 1.3mm;
    font-size: 4.2pt; color: rgba(234,246,243,.42);
    line-height: 1.35; max-width: 48mm;
  }
</style>
</head>
<body>
<div class="card">
  <div class="bar"></div>
  <div class="main">
    <div class="avatar">JR</div>
    <h1>Jorge A. Rodríguez Aguirregabiria</h1>
    <p class="pill">Médico Intensivista · UCI</p>
    <div class="contact">
      <span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        jrodagu@gmail.com
      </span>
      <span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h4l1.5 5-2.5 1.5a12 12 0 005.5 5.5L15 13.5l5 1.5v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg>
        +34 670 425 741
      </span>
      <span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-6-7-11a7 7 0 0114 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        28224 Pozuelo de Alarcón · Madrid
      </span>
    </div>
    <div class="langs">
      <a class="lang" href="https://jrodagu-star.github.io/cv/">
        <span class="flag"><svg viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="1.15"><rect x="0.7" y="0.7" width="22.6" height="14.6" rx="1.2"/><path d="M1.2 5.4h21.6M1.2 10.6h21.6"/></svg></span>
        <span class="name">Español</span>
      </a>
      <a class="lang" href="https://jrodagu-star.github.io/cv/en/">
        <span class="flag"><svg viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="1.15"><rect x="0.7" y="0.7" width="22.6" height="14.6" rx="1.2"/><path d="M1.4 1.4 L22.6 14.6M22.6 1.4 L1.4 14.6M12 1.2 V14.8M1.2 8 H22.8"/></svg></span>
        <span class="name">English</span>
      </a>
      <a class="lang" href="https://jrodagu-star.github.io/cv/ca/">
        <span class="flag"><svg viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="1.15"><rect x="0.7" y="0.7" width="22.6" height="14.6" rx="1.2"/><path d="M1.4 3.6h21.2M1.4 6.6h21.2M1.4 9.6h21.2M1.4 12.6h21.2"/></svg></span>
        <span class="name">Català</span>
      </a>
    </div>
    <p class="caption"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l7.2 16 2-6.2L20 11.5z"/><path d="M13.5 13.5L19 19"/></svg>Pulsa para ver el CV</p>
    <p class="foot">UCI HM Puerta del Sur · UCI Madrid Montepríncipe · Madrid</p>
  </div>
</div>
</body>
</html>
