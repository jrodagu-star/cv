<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jorge A. Rodríguez Aguirregabiria | Tarjeta de visita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #031835;
    --gold: #c6a35a;
    --cream: #f3f1ea;
    --cream-dim: #e7e4dc;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e7ebf0; font-family: Montserrat, sans-serif; color: #1b3044; }
  h1, h2, p { margin: 0; }
  button { font: inherit; cursor: pointer; }
  a { color: inherit; }
  .workspace { min-height: 100dvh; padding: 32px; display: flex; flex-direction: column; align-items: center; }
  .toolbar { width: min(100%, 920px); display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid #ccd5dd; }
  .eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #526575; margin-bottom: 6px; }
  h1 { font-family: "Playfair Display", serif; font-weight: 500; font-size: 28px; }
  .actions { display: flex; gap: 8px; }
  .actions button { min-height: 44px; padding: 10px 14px; border: 1px solid #ccd5dd; border-radius: 6px; background: #fff; }
  .actions .primary { background: #1b3044; color: #fff; border-color: #1b3044; }
  .scene { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 0; }
  .card {
    position: relative;
    container-type: inline-size;
    width: 520px;
    aspect-ratio: 85 / 55;
    background: var(--navy) url("grain.png");
    background-size: 14cqw 14cqw;
    color: var(--cream);
    overflow: hidden;
    border-radius: 3.6cqw;
    box-shadow: 0 18px 40px #03183533;
  }
  .grain { display: none; }
  .inner {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3.4cqw 5.6cqw 3.2cqw;
  }
  .emblem { width: 15.2cqw; height: auto; display: block; }
  .name {
    margin-top: 1.5cqw;
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 500;
    font-size: 7.5cqw;
    line-height: .95;
    letter-spacing: -.01em;
    color: var(--cream);
    text-align: center;
  }
  .divider {
    margin-top: 1.3cqw;
    width: 46cqw;
    display: flex;
    align-items: center;
    gap: 1.6cqw;
  }
  .divider span { flex: 1; height: 0.22cqw; background: var(--gold); }
  .divider i { width: 1.15cqw; height: 1.15cqw; border-radius: 50%; background: var(--gold); }
  .spec {
    margin-top: 1.25cqw;
    color: var(--gold);
    font-size: 2.35cqw;
    font-weight: 500;
    letter-spacing: .34em;
    text-indent: .34em;
  }
  .unit {
    margin-top: 0.7cqw;
    color: var(--cream-dim);
    font-size: 2.05cqw;
    font-weight: 400;
    letter-spacing: .38em;
    text-indent: .38em;
  }
  .bottom {
    margin-top: auto;
    width: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 3cqw;
  }
  .contacts { display: flex; flex-direction: column; gap: 1.15cqw; }
  .row { display: flex; align-items: flex-start; gap: 1.5cqw; }
  .row a { color: inherit; text-decoration: none; }
  .ic { width: 3.2cqw; height: 3.2cqw; flex: none; color: var(--gold); margin-top: .1cqw; }
  .row div { min-width: 0; }
  .row span, .row em {
    font-style: normal;
    font-size: 2.55cqw;
    line-height: 1.25;
    letter-spacing: .01em;
    color: var(--cream);
  }
  .row em { display: block; }
  .tick {
    display: block;
    width: 13cqw;
    height: 0.22cqw;
    margin-top: 1.05cqw;
    background: var(--gold);
  }
  .qr {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .7cqw;
    flex: none;
    text-decoration: none;
    color: var(--gold);
  }
  .qr img {
    width: 21cqw;
    height: 21cqw;
    display: block;
    background: var(--cream);
    border-radius: 1.2cqw;
  }
  .qr span {
    font-size: 1.55cqw;
    font-weight: 500;
    letter-spacing: .18em;
    text-indent: .18em;
    line-height: 1;
  }
  @media print {
    @page { size: 85mm 55mm; margin: 0; }
    html, body { background: #fff !important; margin: 0; width: 85mm; height: 55mm; }
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .workspace { display: block; min-height: 0; padding: 0; }
    .toolbar { display: none !important; }
    .scene { display: block; padding: 0; }
    .card {
      position: fixed; top: 0; left: 0;
      width: 85mm; height: 55mm;
      border-radius: 3mm;
      box-shadow: none;
    }
  }
  html.export, html.export body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
  html.export .toolbar { display: none !important; }
  html.export .workspace { display: block; min-height: 0; padding: 0; width: 100%; height: 100%; }
  html.export .scene { display: block; padding: 0; width: 100%; height: 100%; }
  html.export .card { width: 100vw; height: 100vh; aspect-ratio: auto; border-radius: 3.6cqw; box-shadow: none; }
</style>
</head>
<body>
<main class="workspace">
  <header class="toolbar">
    <div>
      <p class="eyebrow">Jorge A. Rodríguez Aguirregabiria</p>
      <h1>Tarjeta de visita</h1>
    </div>
    <div class="actions">
      <button class="primary" id="print" type="button">Imprimir tarjeta</button>
    </div>
  </header>
  <div class="scene">
    <article class="card" aria-label="Tarjeta de visita de Jorge A. Rodríguez Aguirregabiria">
      <div class="grain" aria-hidden="true"></div>
      <div class="inner">
        <img class="emblem" src="emblem.png" alt="">
        <h2 class="name">Dr. J. Rodriguez</h2>
        <div class="divider" aria-hidden="true"><span></span><i></i><span></span></div>
        <p class="spec">MEDICINA INTENSIVA</p>
        <p class="unit">UNIDAD DE CRÍTICOS</p>
        <div class="bottom">
          <div class="contacts">
            <div class="row">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5h3l1.2 3.2-2 1.2a12 12 0 005.4 5.4l1.2-2 3.2 1.2v3a1.6 1.6 0 01-1.6 1.6A14.5 14.5 0 014.9 5.1a1.6 1.6 0 011.6-1.6z"/></svg>
              <div>
                <a href="tel:+34670425741"><span>+34 670 425 741</span></a>
                <i class="tick"></i>
              </div>
            </div>
            <div class="row">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="1.6"/><path d="M4 7l8 6 8-6"/></svg>
              <div>
                <a href="mailto:jrodagu@gmail.com"><span>jrodagu@gmail.com</span></a>
                <i class="tick"></i>
              </div>
            </div>
            <div class="row">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.2-5.2-6.2-10a6.2 6.2 0 1112.4 0C18.2 15.8 12 21 12 21z"/><circle cx="12" cy="11" r="2.1"/></svg>
              <div>
                <em>HM Puerta del Sur /</em>
                <em>Madrid Montepríncipe</em>
              </div>
            </div>
          </div>
          <a class="qr" href="https://jrodagu-star.github.io/cv/">
            <img src="qr-cv.svg" alt="">
            <span>CURRÍCULUM</span>
          </a>
        </div>
      </div>
    </article>
  </div>
</main>
<script>
  if (location.search.includes("export")) document.documentElement.classList.add("export");
  document.getElementById("print").addEventListener("click", () => window.print());
</script>
</body>
</html>
